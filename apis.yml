name: Frontier Car group
description: 'Frontier Car Group (FCG) was a Berlin-based startup, founded in 2016, that built, launched,
  and operated online and offline used-car marketplaces across high-growth emerging markets including
  Nigeria, Mexico, Chile, Pakistan, Indonesia, India and Poland, offering vehicle inspections, pricing
  guides, financing, warranties and insurance. OLX Group (Prosus/Naspers) invested up to $400M at a $700M
  valuation in 2019 and folded FCG into its OLX Autos brand; the Berlin operations were shut down in 2021
  and Prosus later moved to exit the car-classifieds business. As of this enrichment pass the
  frontiercargroup.com domain no longer resolves (registered and ACTIVE through 2027 but serving no DNS
  A/NS records), the api.frontiercargroup.com host does not resolve, and the company publishes no
  developer, API, documentation, or other machine-readable surface. Originally surfaced as a Partech
  portfolio lead.'
